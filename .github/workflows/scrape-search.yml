# 先打 page=1 拿 total，再按每片 20 页分片并行，全部完成后合并 search-list.json
name: Scrape search list

on:
  workflow_dispatch:
    inputs:
      sort_by:
        description: 'sortBy'
        type: choice
        options:
          - latest
          - growth
          - mrr
          - revenue
        default: latest
      wait_s:
        description: '429 后等待秒数'
        required: false
        default: '50'
      pages_per_shard:
        description: '每片页数（单 IP 每分钟额度）'
        required: false
        default: '20'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Plan shards
        id: plan
        env:
          SORT_BY: ${{ inputs.sort_by }}
          WAIT_S: ${{ inputs.wait_s }}
          PAGES_PER_SHARD: ${{ inputs.pages_per_shard }}
          TRUSTMRR_COOKIE: ${{ secrets.TRUSTMRR_COOKIE }}
        run: node scrape-search.mjs --plan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: search-plan
          path: search-plan.json

  scrape:
    needs: plan
    if: ${{ needs.plan.outputs.shard_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: search-plan

      - name: Scrape shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SORT_BY: ${{ inputs.sort_by }}
          WAIT_S: ${{ inputs.wait_s }}
          PAGES_PER_SHARD: ${{ inputs.pages_per_shard }}
          TRUSTMRR_COOKIE: ${{ secrets.TRUSTMRR_COOKIE }}
        run: node scrape-search.mjs --shard ${{ matrix.shard }}

      - name: Upload shard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-shard-${{ matrix.shard }}
          path: search-shard-${{ matrix.shard }}.json
          if-no-files-found: error

  merge:
    if: ${{ always() && needs.plan.outputs.shard_count != '0' }}
    needs: [plan, scrape]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true

      - name: Merge
        run: node scrape-search.mjs --merge

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add search-plan.json search-list.json search-failed.json
          git diff --cached --quiet || git commit -m "chore: update search list [skip ci]"
          git push
