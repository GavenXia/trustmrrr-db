name: Scrape compare

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run batch
        run: node main.mjs

      - name: Run pool
        run: node main.mjs --pool

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add batch.json pool.json
          git diff --cached --quiet || git commit -m "chore: update data [skip ci]"
          git push
