# 探测 POST /api/search 的限流：打满后停发，等待 wait-s 再串行重试 429
name: Probe search rate limit

on:
  workflow_dispatch:
    inputs:
      interval_ms:
        description: '主队列发出间隔（毫秒）'
        required: false
        default: '200'
      wait_s:
        description: '第一次 429 后停发等待秒数'
        required: false
        default: '50'
      max_cycles:
        description: '打满→等待→串行重试 的轮数'
        required: false
        default: '3'
      max_requests:
        description: '最多发出次数'
        required: false
        default: '800'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe /api/search
        env:
          INTERVAL_MS: ${{ inputs.interval_ms }}
          WAIT_S: ${{ inputs.wait_s }}
          MAX_CYCLES: ${{ inputs.max_cycles }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          TRUSTMRR_COOKIE: ${{ secrets.TRUSTMRR_COOKIE }}
        run: node probe-search-ratelimit.mjs
